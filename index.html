<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Redemption's Edge</title>
<!-- PWA: installable from the browser menu / "Add to Home Screen" -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0d0a06" />
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
<!-- iOS home-screen install (Safari ignores the manifest for most of this) -->
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Redemption" />
<style>
  /* ===========================================================================
     PAGE SHELL  â€”  dark Western aesthetic
     =========================================================================== */
  :root {
    --leather: #3a2a1a;
    --dust:    #c9a877;
    --ochre:   #b5712b;
    --blood:   #8a1f1f;
    --sepia:   #e8d5a8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0d0a06;
    overflow: hidden;
    font-family: 'Georgia', 'Times New Roman', serif;
    color: var(--sepia);
    user-select: none;
    /* mobile: no pull-to-refresh, no double-tap zoom, no long-press menus */
    overscroll-behavior: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  #game-wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at center, #1a1209 0%, #0d0a06 70%, #050402 100%);
  }
  canvas {
    display: block;
    background: #1c1408;
    box-shadow: 0 0 60px rgba(0,0,0,0.9), inset 0 0 120px rgba(0,0,0,0.5);
    image-rendering: optimizeQuality;
    max-width: 100%; max-height: 100%;
    touch-action: none;   /* the game owns every gesture on the canvas */
  }
  /* Vignette overlay drawn over the canvas for cinematic framing */
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 200px rgba(0,0,0,0.85);
    z-index: 5;
  }
  #hint {
    position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: #6b5638; letter-spacing: 1px; z-index: 6;
    pointer-events: none; opacity: 0.7;
  }
</style>
</head>
<body>
  <div id="game-wrap">
    <canvas id="game" width="1280" height="720"></canvas>
  </div>
  <div id="vignette"></div>
  <div id="hint">WASD Move &nbsp;â€¢&nbsp; Mouse Aim &nbsp;â€¢&nbsp; Click Fire &nbsp;â€¢&nbsp; RMB Dead Eye &nbsp;â€¢&nbsp; Shift Dash &nbsp;â€¢&nbsp; Q Dynamite &nbsp;â€¢&nbsp; F Lasso &nbsp;â€¢&nbsp; H Whistle &nbsp;â€¢&nbsp; R Reload &nbsp;â€¢&nbsp; E Interact &nbsp;â€¢&nbsp; ESC Pause</div>

  <!-- ?v= is a cache-buster: bump it whenever game/*.js changes so browsers
       (file:// and localhost alike) can't serve a stale build. -->
  <script src="game/config.js?v=53"></script>
  <script src="game/utils.js?v=53"></script>
  <script src="game/input.js?v=53"></script>
  <script src="game/touch.js?v=53"></script>
  <script src="game/audio.js?v=53"></script>
  <script src="game/camera.js?v=53"></script>
  <script src="game/world.js?v=53"></script>
  <script src="game/assets.js?v=53"></script>
  <script src="game/chris-manifest.js?v=53"></script>
  <script src="game/horse-manifest.js?v=53"></script>
  <script src="game/sprites.js?v=53"></script>
  <script src="game/entities.js?v=53"></script>
  <script src="game/systems.js?v=53"></script>
  <script src="game/game.js?v=53"></script>
  <script src="game/render.js?v=53"></script>
  <script src="game/main.js?v=53"></script>

</body>
</html>
